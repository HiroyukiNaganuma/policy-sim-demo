<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新しいテトリス</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>新しいテトリス</h1>
        <p>← → 移動 / ↑ 回転 / ↓ ソフトドロップ / Space ハードドロップ / P 一時停止</p>
        <div class="stats">
          <div><span>スコア</span><strong id="score">0</strong></div>
          <div><span>レベル</span><strong id="level">1</strong></div>
          <div><span>ライン</span><strong id="lines">0</strong></div>
        </div>
        <button id="startBtn">スタート / リスタート</button>
      </section>
      <section class="board-wrap">
        <canvas id="game" width="300" height="600" aria-label="テトリス盤面"></canvas>
        <div id="overlay" class="overlay">スタートを押してください</div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
